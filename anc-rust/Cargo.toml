[package]
name = "anc-rust"
version = "0.1.0"
edition = "2021"
authors = ["DRDO SIH 26052 Core Team"]
description = "Real-Time AI Active Noise Cancellation & Spatial Speech Enhancement Daemon for Embedded Edge (Raspberry Pi 5)"

[dependencies]
rustfft = "6.2"
num-complex = "0.4"
rtrb = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
clap = { version = "4.5", features = ["derive"] }
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
byteorder = "1.5"
tract-onnx = "0.21"

[dev-dependencies]
approx = "0.5"

[[bin]]
name = "anc-edge"
path = "src/bin/edge.rs"

[[bin]]
name = "anc-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "anc-process"
path = "src/bin/process.rs"

