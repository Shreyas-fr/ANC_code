[package]
name = "anc-frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
anc-rust = { path = "../anc-rust" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
egui_plot = "0.29"
cpal = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
rustfft = "6.2"
chrono = "0.4"

